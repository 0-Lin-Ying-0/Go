services:
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=device_discovery
      - MYSQL_ROOT_HOST=%          # 放开 root 远程（方便 GoLand 连接）
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: dev-discovery
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=device_discovery
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW

volumes:
  mysql_data:
